<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>测测你的AI人格 - PM 520特别版</title>
<style>
:root {
  --bg: #0a0a0f;
  --bg-card: #12121a;
  --bg-card-hover: #1a1a28;
  --text: #e8e8f0;
  --text-secondary: #9898b0;
  --text-muted: #686880;
  --accent: #ff4d6a;
  --accent-glow: #ff4d6a66;
  --accent2: #7c5cfc;
  --accent2-glow: #7c5cfc66;
  --gold: #f0c060;
  --gold-glow: #f0c06044;
  --border: #2a2a3a;
  --border-active: #ff4d6a55;
  --radius: 16px;
  --radius-sm: 10px;
  --font-display: 'Georgia', 'Noto Serif SC', serif;
  --font-body: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
#particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.particle { position: absolute; border-radius: 50%; animation: floatUp linear infinite; opacity: 0; }
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}
.app-container { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 20px 16px 40px; }
.page { display: none; animation: pageIn 0.5s ease-out; }
.page.active { display: block; }
@keyframes pageIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* 首页 */
.hero { text-align: center; padding: 40px 0 20px; }
.hero-icon { font-size: 72px; animation: heartbeat 1.2s ease-in-out infinite; display: inline-block; }
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  14% { transform: scale(1.15); }
  28% { transform: scale(1); }
  42% { transform: scale(1.1); }
  56% { transform: scale(1); }
}
.hero-title { font-family: var(--font-display); font-size: 28px; font-weight: 700; margin: 16px 0 8px; background: linear-gradient(135deg, #ff4d6a, #ff8fa3, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.4; }
.hero-subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 8px; letter-spacing: 2px; }
.hero-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px; }
.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 40px; font-size: 17px; font-weight: 600; color: #fff;
  background: linear-gradient(135deg, #ff4d6a, #e0445e); border: none;
  border-radius: 50px; cursor: pointer; transition: all 0.3s;
  box-shadow: 0 4px 24px var(--accent-glow); letter-spacing: 1px;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px var(--accent-glow); }
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-secondary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 28px; font-size: 14px; font-weight: 500; color: var(--text);
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 50px; cursor: pointer; transition: all 0.3s;
}
.btn-secondary:hover { border-color: var(--accent2); background: var(--bg-card-hover); }
.features { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 24px 0; }
.feature-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; text-align: center; transition: all 0.3s; }
.feature-item:hover { border-color: var(--border-active); background: var(--bg-card-hover); }
.feature-icon { font-size: 28px; margin-bottom: 6px; }
.feature-label { font-size: 12px; color: var(--text-secondary); }

/* 答题页 */
.quiz-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.quiz-back { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
.quiz-back:hover { border-color: var(--accent2); color: var(--text); }
.progress-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #ff4d6a, #c084fc); border-radius: 3px; transition: width 0.4s ease; }
.progress-text { font-size: 13px; color: var(--text-secondary); min-width: 48px; text-align: right; }
.question-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 24px; margin-bottom: 16px; transition: all 0.3s; }
.question-section-label { display: inline-block; font-size: 11px; color: var(--accent2); background: var(--accent2-glow); padding: 4px 12px; border-radius: 20px; margin-bottom: 16px; letter-spacing: 1px; }
.question-text { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.5; margin-bottom: 24px; color: #fff; }
.options-list { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 16px 18px; background: var(--bg); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); cursor: pointer; transition: all 0.25s;
  text-align: left; color: var(--text); font-size: 14px; line-height: 1.5;
}
.option-btn:hover { border-color: var(--accent2); background: var(--bg-card-hover); transform: translateX(4px); }
.option-btn.selected { border-color: var(--accent); background: #ff4d6a10; box-shadow: 0 0 20px var(--accent-glow); }
.option-emoji { font-size: 24px; flex-shrink: 0; width: 32px; text-align: center; padding-top: 2px; }
.option-content { flex: 1; }
.option-label { font-weight: 600; margin-bottom: 2px; }
.option-desc { font-size: 12px; color: var(--text-muted); }
.quiz-nav { display: flex; gap: 12px; margin-top: 8px; }
.quiz-nav .btn-primary { flex: 1; }

/* 结果页 */
.result-header { text-align: center; padding: 20px 0; }
.result-badge { display: inline-block; font-size: 13px; color: var(--gold); background: var(--gold-glow); padding: 6px 16px; border-radius: 20px; letter-spacing: 2px; margin-bottom: 12px; }
.result-personality-icon { font-size: 80px; animation: heartbeat 2s ease-in-out infinite; display: block; margin: 16px auto; }
.result-code { font-family: var(--font-display); font-size: 36px; font-weight: 700; letter-spacing: 4px; background: linear-gradient(135deg, #f0c060, #ff8fa3, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.result-name { font-size: 22px; font-weight: 600; margin: 8px 0; }
.result-tagline { font-size: 14px; color: var(--text-secondary); font-style: italic; margin-bottom: 8px; }
.result-stars { font-size: 18px; margin-bottom: 16px; letter-spacing: 2px; }
.result-stars span { color: var(--text-muted); font-size: 12px; margin-left: 4px; }

/* 维度条 */
.dimensions-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.dimensions-title { font-size: 13px; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 16px; text-align: center; }
.dimension-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dimension-label { font-size: 12px; color: var(--text-secondary); width: 56px; text-align: right; flex-shrink: 0; }
.dimension-bar-wrap { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; position: relative; }
.dimension-bar { height: 100%; border-radius: 4px; transition: width 1s ease-out; }
.dimension-bar.ip { background: linear-gradient(90deg, #ff4d6a, #ff8fa3); }
.dimension-bar.sd { background: linear-gradient(90deg, #ff8fa3, #f0c060); }
.dimension-bar.ef { background: linear-gradient(90deg, #7c5cfc, #c084fc); }
.dimension-bar.ac { background: linear-gradient(90deg, #4dc9f6, #7c5cfc); }
.dimension-pct { font-size: 12px; color: var(--text-secondary); width: 36px; flex-shrink: 0; }
.dimension-ends { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); padding: 0 56px 0 66px; margin-top: -8px; margin-bottom: 12px; }

/* 情书卡片 */
.love-letter { background: linear-gradient(135deg, #1a1a2e, #1a1a28); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; position: relative; overflow: hidden; }
.love-letter::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 30% 20%, #ff4d6a08, transparent 50%), radial-gradient(circle at 70% 80%, #7c5cfc08, transparent 50%); }
.love-letter-title { font-size: 13px; color: var(--accent); letter-spacing: 2px; margin-bottom: 12px; position: relative; }
.love-letter-content { font-size: 14px; line-height: 1.8; color: var(--text-secondary); position: relative; }

/* CP匹配 */
.cp-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.cp-title { font-size: 13px; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 16px; text-align: center; }
.cp-pair { display: flex; align-items: center; justify-content: center; gap: 16px; }
.cp-person { text-align: center; flex: 1; }
.cp-person-icon { font-size: 40px; display: block; margin-bottom: 4px; }
.cp-person-code { font-size: 14px; font-weight: 700; color: var(--text); }
.cp-person-name { font-size: 12px; color: var(--text-secondary); }
.cp-person-need { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.cp-arrow { font-size: 24px; color: var(--accent); animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }

/* 工具姻缘签 */
.tools-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.tools-title { font-size: 13px; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 12px; text-align: center; }
.tool-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.tool-item:last-child { border-bottom: none; }
.tool-tag { font-size: 11px; padding: 3px 10px; border-radius: 12px; flex-shrink: 0; }
.tool-tag.good { background: #4dc9f620; color: #4dc9f6; }
.tool-tag.bad { background: #ff4d6a20; color: #ff4d6a; }

/* 进阶指南 */
.guide-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.guide-title { font-size: 13px; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 12px; text-align: center; }
.guide-content { font-size: 13px; line-height: 1.8; color: var(--text-secondary); }

/* 底部操作 */
.result-actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.result-actions .btn-primary { flex: 1; min-width: 120px; }
.result-actions .btn-secondary { flex: 1; min-width: 100px; }

/* 分享弹窗 */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; max-width: 400px; width: 90%; text-align: center; }
.modal-close { float: right; background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
.poster-preview { background: linear-gradient(135deg, #1a1a2e, #0a0a1a); border-radius: var(--radius-sm); padding: 24px; margin: 16px 0; border: 1px solid var(--border); }
.poster-icon { font-size: 48px; }
.poster-code { font-size: 28px; font-weight: 700; letter-spacing: 3px; margin: 8px 0; }
.poster-name { font-size: 18px; color: var(--text-secondary); }
.poster-qr { margin-top: 12px; font-size: 11px; color: var(--text-muted); }

/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 12px 24px; border-radius: 50px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }

@media (max-width: 360px) {
  .hero-title { font-size: 24px; }
  .question-text { font-size: 17px; }
  .result-code { font-size: 28px; }
}
</style>
</head>
<body>
<div id="particles"></div>
<div class="toast" id="toast"></div>

<div class="app-container" id="app">

  <!-- 首页 -->
  <div class="page active" id="page-home">
    <div class="hero">
      <div class="hero-icon">💘</div>
      <h1 class="hero-title">找对你的<br>AI灵魂伴侣</h1>
      <p class="hero-subtitle">PM的AI应用心动指数测评</p>
      <p class="hero-desc">20道题 · 16种AI恋爱人格<br>找到属于你的AI最佳CP</p>
    </div>
    <div class="features">
      <div class="feature-item"><div class="feature-icon">💝</div><div class="feature-label">4维人格模型</div></div>
      <div class="feature-item"><div class="feature-icon">🔮</div><div class="feature-label">16型恋爱人格</div></div>
      <div class="feature-item"><div class="feature-icon">💌</div><div class="feature-label">PM专属情书</div></div>
      <div class="feature-item"><div class="feature-icon">🤝</div><div class="feature-label">AI最佳CP匹配</div></div>
    </div>
    <div style="text-align:center">
      <button class="btn-primary" onclick="startQuiz()">💘 开始测评</button>
      <p style="margin-top:12px;font-size:11px;color:var(--text-muted)">约2分钟 · 20道趣味题目</p>
    </div>
  </div>

  <!-- 答题页 -->
  <div class="page" id="page-quiz">
    <div class="quiz-header">
      <button class="quiz-back" onclick="prevQuestion()" id="btn-back" style="visibility:hidden">←</button>
      <div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
      <span class="progress-text" id="progress-text">1/20</span>
    </div>
    <div class="question-card" id="question-card">
      <div class="question-section-label" id="question-section"></div>
      <div class="question-text" id="question-text"></div>
      <div class="options-list" id="options-list"></div>
    </div>
    <div class="quiz-nav">
      <button class="btn-primary" id="btn-next" onclick="nextQuestion()" style="display:none">下一题 →</button>
    </div>
  </div>

  <!-- 结果页 -->
  <div class="page" id="page-result">
    <div class="result-header">
      <div class="result-badge">💘 找对你的AI灵魂伴侣 · 测评结果</div>
      <span class="result-personality-icon" id="result-icon"></span>
      <div class="result-code" id="result-code"></div>
      <div class="result-name" id="result-name"></div>
      <div class="result-tagline" id="result-tagline"></div>
      <div class="result-stars" id="result-stars"></div>
    </div>
    <div class="dimensions-card">
      <div class="dimensions-title">📊 你的AI恋爱维度</div>
      <div id="dimensions-container"></div>
    </div>
    <div class="love-letter">
      <div class="love-letter-title">💌 PM专属情书</div>
      <div class="love-letter-content" id="love-letter"></div>
    </div>
    <div class="cp-card">
      <div class="cp-title">🔗 你的AI最佳CP匹配</div>
      <div class="cp-pair" id="cp-pair"></div>
    </div>
    <div class="tools-card">
      <div class="tools-title">🛠 你的AI工具姻缘签</div>
      <div id="tools-list"></div>
    </div>
    <div class="guide-card">
      <div class="guide-title">📈 进阶修仙指南</div>
      <div class="guide-content" id="guide-content"></div>
    </div>
    <div class="result-actions">
      <button class="btn-primary" onclick="submitResult()">📋 提交我的结果</button>
      <button class="btn-primary" onclick="shareResult()" style="background:linear-gradient(135deg,#7c5cfc,#c084fc);box-shadow:0 4px 24px var(--accent2-glow)">📤 生成分享海报</button>
      <button class="btn-secondary" onclick="findCP()">🔍 找我的CP</button>
      <button class="btn-secondary" onclick="retakeQuiz()">🔄 再测一次</button>
    </div>
  </div>

  <!-- 分享弹窗 -->
  <div class="modal-overlay" id="modal-share">
    <div class="modal-content">
      <button class="modal-close" onclick="closeShareModal()">✕</button>
      <h3 style="margin-bottom:8px">📤 分享你的AI恋爱人格</h3>
      <div class="poster-preview" id="poster-preview">
        <div class="poster-icon" id="poster-icon"></div>
        <div class="poster-code" id="poster-code"></div>
        <div class="poster-name" id="poster-name"></div>
        <div class="poster-qr">扫码来测测你的AI灵魂伴侣 →</div>
      </div>
      <button class="btn-primary" onclick="copyShareText()" style="width:100%">📋 复制分享文案</button>
      <button class="btn-secondary" onclick="closeShareModal()" style="width:100%;margin-top:8px">关闭</button>
    </div>
  </div>

</div>

<script>
// ==================== 20道题目（每题3选项） ====================
const questions = [
  // ===== 开场热身 4题 =====
  { id:1, section:'💕 开场热身', text:'凌晨2点你在赶项目计划，脑子卡壳了。此时你：', options:[
    {emoji:'❤️', label:'随手打开最近对话框', desc:'"宝，帮我看看这个排期"', dim:'IP', val:'I'},
    {emoji:'🔒', label:'先列清楚再召唤', desc:'当前问题、背景、约束条件，再召唤AI', dim:'IP', val:'P'},
    {emoji:'💡', label:'先自己理清思路', desc:'画个思维导图，再让AI补充盲区', dim:'IP', val:'M'}
  ]},
  { id:2, section:'💕 开场热身', text:'AI第一次给你的回答，哪种让你心跳加速？', options:[
    {emoji:'❤️', label:'超出预期的创意', desc:'完全没想到的角度，你连说"卧槽"', dim:'IP', val:'I'},
    {emoji:'🔒', label:'结构化123', desc:'直接能贴进评审材料', dim:'IP', val:'P'},
    {emoji:'💡', label:'创意+落地兼备', desc:'既有创意框架又有落地路径，一步到位', dim:'IP', val:'M'}
  ]},
  { id:3, section:'💕 开场热身', text:'你手上同时有3个项目需求待处理，你会怎么用AI？', options:[
    {emoji:'❤️', label:'全部丢给AI', desc:'"帮我评估优先级，半小时出结果"', dim:'IP', val:'I'},
    {emoji:'🔒', label:'自己先排权重矩阵', desc:'让AI按框架填充数据验证', dim:'IP', val:'P'},
    {emoji:'💡', label:'AI初排+人工复核', desc:'让AI先出初版排序，你复核调整后再定稿', dim:'IP', val:'M'}
  ]},
  { id:4, section:'💕 开场热身', text:'你习惯怎么管理项目文档？', options:[
    {emoji:'❤️', label:'想到什么写什么', desc:'文档是流动的、活的', dim:'IP', val:'I'},
    {emoji:'🔒', label:'固定模板+版本管理', desc:'每次更新都留记录', dim:'IP', val:'P'},
    {emoji:'💡', label:'有框架但灵活调整', desc:'有大致框架，根据项目灵活调整格式', dim:'IP', val:'M'}
  ]},
  // ===== 需求场景 4题 =====
  { id:5, section:'📋 需求场景', text:'项目启动会开完，你要用AI帮你排期，你会：', options:[
    {emoji:'❤️', label:'一句话描述', desc:'"帮我排个项目计划，3个月上线"', dim:'IP', val:'I'},
    {emoji:'🔒', label:'先拆WBS+依赖关系', desc:'让AI按约束条件生成最优排期', dim:'IP', val:'P'},
    {emoji:'💡', label:'给历史排期做参考', desc:'让AI基于类似项目历史排期生成新计划再调', dim:'IP', val:'M'}
  ]},
  { id:6, section:'📋 需求场景', text:'要启动新项目，你用AI帮你做立项准备：', options:[
    {emoji:'❤️', label:'一句话', desc:'"帮我写一份项目立项书，我要拿去汇报"', dim:'IP', val:'I'},
    {emoji:'🔒', label:'输入完整背景', desc:'项目背景、目标、资源约束、风险清单，按模板生成', dim:'IP', val:'P'},

// ==================== 应用状态 ====================
let currentPage = 'home';
let currentQuestion = 0;
let answers = {};
let selectedOption = null;

// ==================== 页面导航 ====================
function showPage(pageName) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + pageName).classList.add('active');
  currentPage = pageName;
  window.scrollTo(0, 0);
}

// ==================== 粒子背景 ====================
function createParticles() {
  const container = document.getElementById('particles');
  const colors = ['#ff4d6a', '#ff8fa3', '#c084fc', '#7c5cfc', '#f0c060', '#4dc9f6'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.width = (Math.random() * 4 + 2) + 'px';
    p.style.height = p.style.width;
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (Math.random() * 10 + 8) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(p);
  }
}

// ==================== Toast ====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ==================== 答题逻辑 ====================
function startQuiz() {
  currentQuestion = 0;
  answers = { IP: [], SD: [], EF: [], AC: [] };
  selectedOption = null;
  showPage('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQuestion];
  selectedOption = null;
  document.getElementById('question-section').textContent = q.section;
  document.getElementById('question-text').textContent = q.text;
  document.getElementById('progress-text').textContent = (currentQuestion + 1) + '/28';
  document.getElementById('progress-bar').style.width = ((currentQuestion + 1) / 20 * 100) + '%';
  document.getElementById('btn-back').style.visibility = currentQuestion > 0 ? 'visible' : 'hidden';
  const btnNext = document.getElementById('btn-next');
  btnNext.disabled = true;
  btnNext.textContent = currentQuestion < 19 ? '下一题 →' : '查看结果 💘';
  const optionsList = document.getElementById('options-list');
  optionsList.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-emoji">${opt.emoji}</span><div class="option-content"><div class="option-label">${opt.label}</div><div class="option-desc">${opt.desc}</div></div>`;
    btn.onclick = () => selectOption(idx, opt);
    optionsList.appendChild(btn);
  });
}

function selectOption(idx, opt) {
  selectedOption = { idx, opt };
  document.querySelectorAll('.option-btn').forEach((btn, i) => btn.classList.toggle('selected', i === idx));
  // 自动跳转下一题
  setTimeout(() => nextQuestion(), 300);
}

function nextQuestion() {
  if (!selectedOption) return;
  const dim = selectedOption.opt.dim;
  const val = selectedOption.opt.val;
  if (!answers[dim]) answers[dim] = [];
  answers[dim].push(val);
  if (currentQuestion < 19) {
    currentQuestion++;
    renderQuestion();
  } else {
    calculateResult();
  }
}

function prevQuestion() {
  if (currentQuestion > 0) {
    const prevQ = questions[currentQuestion - 1];
    const prevDim = prevQ.options[0].dim;
    if (answers[prevDim] && answers[prevDim].length > 0) answers[prevDim].pop();
    currentQuestion--;
    renderQuestion();
  }
}

// ==================== 计分逻辑 ====================
function calculateResult() {
  const dims = ['IP', 'SD', 'EF', 'AC'];
  const dimConfig = {
    'IP': { leftKey: 'I', rightKey: 'P', leftName: '冲动型', rightName: '计划型' },
    'SD': { leftKey: 'S', rightKey: 'D', leftName: '速配型', rightName: '长情型' },
    'EF': { leftKey: 'E', rightKey: 'F', leftName: '海王型', rightName: '专一型' },
    'AC': { leftKey: 'A', rightKey: 'C', leftName: '甲方型', rightName: 'CP型' }
  };
  const scores = {};

  dims.forEach(dim => {
    const vals = answers[dim] || [];
    let left = 0, right = 0;
    const { leftKey, rightKey } = dimConfig[dim];
    vals.forEach(v => {
      if (v === leftKey) left++;
      else if (v === rightKey) right++;
    });
    const total = left + right;
    let winner;
    if (total === 0) winner = leftKey;
    else if (left >= right) winner = leftKey;
    else winner = rightKey;
    const pct = total > 0 ? Math.round(Math.max(left, right) / total * 100) : 50;
    scores[dim] = { winner, leftKey, rightKey, left, right, total, pct, leftName: dimConfig[dim].leftName, rightName: dimConfig[dim].rightName };
  });

  // 映射到方案中的16种人格代码
  // 方案代码格式: 第1位=IP维度, 第2位=SD维度, 第3位=EF维度, 第4位=AC维度
  const code = scores['IP'].winner + scores['SD'].winner + scores['EF'].winner + scores['AC'].winner;
  showResult(code, scores);
}

// ==================== 结果展示 ====================
function showResult(code, scores) {
  const p = personalities[code];
  if (!p) {
    console.error('❌ 找不到人格代码:', code, '可用:', Object.keys(personalities));
    showToast('结果计算异常，请重试 (code:' + code + ')');
    return;
  }
  showPage('result');

  // 基本信息
  document.getElementById('result-icon').textContent = p.icon;
  document.getElementById('result-code').textContent = code;
  document.getElementById('result-name').textContent = p.icon + ' ' + p.name;
  document.getElementById('result-tagline').textContent = '「' + p.tagline + '」';
  // 星级
  let starsHTML = '';
  for (let i = 0; i < 5; i++) starsHTML += i < p.stars ? '⭐' : '☆';
  document.getElementById('result-stars').innerHTML = starsHTML + '<span>PM岗位适配指数</span>';

  // 维度分析
  const dimClasses = { 'IP': 'ip', 'SD': 'sd', 'EF': 'ef', 'AC': 'ac' };
  let dimHTML = '';
  for (const dim of ['IP', 'SD', 'EF', 'AC']) {
    const s = scores[dim];
    const isLeft = s.winner === s.leftKey;
    const barPct = s.pct;
    dimHTML += `
      <div class="dimension-row">
        <span class="dimension-label">${isLeft ? s.leftName : s.rightName}</span>
        <div class="dimension-bar-wrap"><div class="dimension-bar ${dimClasses[dim]}" style="width:${barPct}%"></div></div>
        <span class="dimension-pct">${barPct}%</span>
      </div>
      <div class="dimension-ends"><span>${s.leftName} ❤️</span><span>🔒 ${s.rightName}</span></div>
    `;
  }
  document.getElementById('dimensions-container').innerHTML = dimHTML;

  // 情书
  document.getElementById('love-letter').innerHTML = p.loveLetter.replace(/\n/g, '<br>');

  // CP匹配
  const cp = personalities[p.cpCode];
  if (cp) {
    document.getElementById('cp-pair').innerHTML = `
      <div class="cp-person">
        <span class="cp-person-icon">${cp.icon}</span>
        <div class="cp-person-code">${p.cpCode}</div>
        <div class="cp-person-name">${cp.name}</div>
        <div class="cp-person-need">${p.cpYouNeed}</div>
      </div>
      <div class="cp-arrow">💘</div>
      <div class="cp-person">
        <span class="cp-person-icon">${p.icon}</span>
        <div class="cp-person-code">${code}</div>
        <div class="cp-person-name">${p.name}</div>
        <div class="cp-person-need">${p.cpTheyNeed}</div>
      </div>
    `;
  } else {
    document.getElementById('cp-pair').innerHTML = '<p style="text-align:center;color:var(--text-muted)">暂无匹配数据</p>';
  }

  // 工具姻缘签
  let toolsHTML = '';
  p.tools.forEach(t => {
    toolsHTML += `<div class="tool-item"><span class="tool-tag ${t.type}">${t.tag}</span><span><strong>${t.name}</strong>：${t.desc}</span></div>`;
  });
  document.getElementById('tools-list').innerHTML = toolsHTML;

  // 进阶指南
  document.getElementById('guide-content').textContent = p.guide;

  // 存储结果
  window._resultData = { code, personality: p, scores };
  reportResult(code, p, scores);
}

// ==================== 数据上报 ====================
function reportResult(code, personality, scores) {
  const WEBHOOK_URL = '';
  const data = {
    timestamp: new Date().toISOString(),
    code: code,
    personality: personality.name,
    stars: personality.stars,
    scores: {
      IP: scores['IP'].winner + '(' + scores['IP'].pct + '%)',
      SD: scores['SD'].winner + '(' + scores['SD'].pct + '%)',
      EF: scores['EF'].winner + '(' + scores['EF'].pct + '%)',
      AC: scores['AC'].winner + '(' + scores['AC'].pct + '%)'
    }
  };
  console.log('📊 测评结果:', data);
  if (WEBHOOK_URL) {
    fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
      .catch(err => console.log('数据上报失败:', err));
  }
  try {
    const history = JSON.parse(localStorage.getItem('ai_love_test_history') || '[]');
    history.push({ time: data.timestamp, code: code, name: personality.name });
    localStorage.setItem('ai_love_test_history', JSON.stringify(history.slice(-10)));
  } catch(e) {}
}

// ==================== 分享功能 ====================
function shareResult() {
  if (!window._resultData) return;
  const { code, personality } = window._resultData;
  document.getElementById('poster-icon').textContent = personality.icon;
  document.getElementById('poster-code').textContent = code;
  document.getElementById('poster-name').textContent = personality.icon + ' ' + personality.name;
  document.getElementById('modal-share').classList.add('active');
}

function closeShareModal() {
  document.getElementById('modal-share').classList.remove('active');
}

function copyShareText() {
  if (!window._resultData) return;
  const { code, personality } = window._resultData;
  const shareText = `💘 我在「AI灵魂伴侣」测评中测出了：\n${personality.icon} ${code} · ${personality.name}\n「${personality.tagline}」\n\n快来测测你的AI恋爱人格，找到你的AI最佳CP！\n👉 点击链接开始测评`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(shareText).then(() => {
      showToast('✅ 分享文案已复制，去粘贴给朋友吧！');
      closeShareModal();
    });
  } else {
    showToast('📋 请长按手动复制分享文案');
  }
}

function findCP() {
  if (!window._resultData) return;
  const { code, personality } = window._resultData;
  const cp = personalities[personality.cpCode];
  if (cp) showToast(`🔍 你的最佳CP是：${cp.icon} ${cp.name}(${personality.cpCode})`);
}

function retakeQuiz() {
  if (confirm('确定要重新测评吗？当前结果将丢失。')) {
    currentQuestion = 0;
    answers = { IP: [], SD: [], EF: [], AC: [] };
    selectedOption = null;
    window._resultData = null;
    startQuiz();
  }
}

// ==================== 提交结果到POPO表单 ====================
function submitResult() {
  if (!window._resultData) return;
  const { code } = window._resultData;
  const formUrl = 'https://docs.popo.netease.com/meta-base-share/form/YtGiMaX';
  // 复制人格代码到剪贴板
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(() => {
      showToast('✅ 人格代码 ' + code + ' 已复制！即将打开表单~');
      setTimeout(() => window.open(formUrl, '_blank'), 600);
    }).catch(() => {
      window.open(formUrl, '_blank');
      showToast('📋 你的人格代码：' + code + '，请粘贴到表单~');
    });
  } else {
    window.open(formUrl, '_blank');
    showToast('📋 你的人格代码：' + code + '，请粘贴到表单~');
  }
}
